plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.androidglassview'
version = '1.0.3'

android {
  namespace "expo.modules.androidglassview"
  defaultConfig {
    versionCode 1
    versionName "1.0.3"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NativeGestureUtil (claiming drags from scrolling parents). Version comes from the app.
  implementation 'com.facebook.react:react-android'
}
